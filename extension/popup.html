<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
      color: #e5e5e5;
      width: 260px;
      padding: 16px;
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      padding: 7px 10px;
      outline: none;
      margin-bottom: 10px;
    }
    input:focus { border-color: #444; }
    button {
      width: 100%;
      background: #fff;
      color: #111;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
      margin-top: 2px;
    }
    button:hover { background: #e5e5e5; }
    .status {
      font-size: 11px;
      color: #4ade80;
      text-align: center;
      margin-top: 10px;
      min-height: 16px;
    }
    .status.error { color: #f87171; }
    .hint {
      font-size: 10px;
      color: #555;
      margin-top: 12px;
      line-height: 1.5;
    }
    .hint a { color: #888; }
  </style>
</head>
<body>
  <div class="logo">rū</div>
  <label>MCP Key</label>
  <input id="key" type="password" placeholder="From garden → Settings" />
  <label>Namespace</label>
  <input id="ns" type="text" placeholder="e.g. diana" />
  <button id="save">Save</button>
  <div class="status" id="status"></div>
  <div class="hint">Get both values from <a href="https://ru-ivory.vercel.app/garden/settings" target="_blank">your garden settings</a>.</div>
  <script src="popup.js"></script>
</body>
</html>
